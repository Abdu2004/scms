<svg viewBox="0 0 560 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Illustration of a complaint being tracked and resolved">
  <!-- Background blob -->
  <ellipse cx="290" cy="230" rx="250" ry="210" fill="#e0f2fe"/>
  <circle cx="470" cy="90" r="34" fill="#fef3c7"/>
  <circle cx="70" cy="360" r="26" fill="#d1fae5"/>

  <!-- Desk -->
  <rect x="90" y="360" width="380" height="18" rx="6" fill="#cbd5e1"/>
  <rect x="120" y="378" width="18" height="46" fill="#94a3b8"/>
  <rect x="420" y="378" width="18" height="46" fill="#94a3b8"/>

  <!-- Monitor / dashboard card -->
  <rect x="150" y="150" width="260" height="190" rx="16" fill="#ffffff" stroke="#1e3a8a" stroke-width="4"/>
  <rect x="150" y="150" width="260" height="40" rx="16" fill="#1e3a8a"/>
  <circle cx="172" cy="170" r="6" fill="#ef4444"/>
  <circle cx="192" cy="170" r="6" fill="#f59e0b"/>
  <circle cx="212" cy="170" r="6" fill="#10b981"/>

  <!-- Complaint list lines inside dashboard -->
  <rect x="172" y="205" width="180" height="12" rx="6" fill="#e2e8f0"/>
  <rect x="172" y="228" width="220" height="24" rx="8" fill="#fef3c7"/>
  <rect x="184" y="235" width="90" height="10" rx="5" fill="#92400e" opacity="0.5"/>
  <rect x="172" y="262" width="220" height="24" rx="8" fill="#e0f2fe"/>
  <rect x="184" y="269" width="110" height="10" rx="5" fill="#075985" opacity="0.5"/>
  <rect x="172" y="296" width="220" height="24" rx="8" fill="#d1fae5"/>
  <rect x="184" y="303" width="70" height="10" rx="5" fill="#065f46" opacity="0.5"/>

  <!-- Person -->
  <circle cx="470" cy="300" r="26" fill="#1e3a8a"/>
  <path d="M436 372c0-24 15-42 34-42s34 18 34 42" fill="#0ea5e9"/>

  <!-- Speech bubble with checkmark (resolution) -->
  <g>
    <rect x="60" y="90" width="120" height="70" rx="16" fill="#ffffff" stroke="#10b981" stroke-width="3"/>
    <path d="M80 160l10 20 16-20z" fill="#ffffff" stroke="#10b981" stroke-width="3"/>
    <circle cx="120" cy="125" r="20" fill="#d1fae5"/>
    <path d="M111 125l6 6 12-13" stroke="#065f46" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Floating notification bell -->
  <g transform="translate(430,50)">
    <circle r="24" fill="#ffffff" stroke="#d97706" stroke-width="3"/>
    <path d="M-6 4c0-8 4-13 6-13s6 5 6 13v3H-6z" fill="#d97706"/>
    <rect x="-2" y="8" width="4" height="4" rx="2" fill="#d97706"/>
    <circle cx="9" cy="-9" r="5" fill="#ef4444"/>
  </g>

  <!-- Decorative dots -->
  <circle cx="500" cy="220" r="5" fill="#0ea5e9"/>
  <circle cx="40" cy="250" r="5" fill="#f59e0b"/>
  <circle cx="60" cy="60" r="4" fill="#1e3a8a"/>
</svg>
